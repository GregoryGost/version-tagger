name: 'Version Tagger'
description: 'GitHub Action to automate tag-based version control. For both production and development.'
author: 'GregoryGost'

branding:
  icon: 'git-branch'
  color: 'blue'

inputs:
  token:
    description: 'The GitHub Token to use for reference management in the repo'
    required: true
  version:
    description: 'Optional explicit SemVer version (`x.y.z`); otherwise read package.json or use 0.1.0'
    required: false
  uselasttag:
    description:
      'Use the highest matching SemVer tag as the source version, regardless of GitHub API order. If there are no tags,
      use the version input, package.json, or 0.1.0. If tags exist but none match, fail.'
    required: false
    default: false
  prefix:
    description: 'A prefix that will appear immediately before the tag version. Example: `v` => `v1.0.0`'
    required: false
  postfix:
    description: 'Postfix that will appear immediately after the tag version. Example: `beta` => `v1.0.0-beta.1`'
    required: false
  postfixnoup:
    description:
      'Do not apply version upgrade to postfix. No number will be added to the postfix. Example: `v1.0.0-beta`,
      `2.5.1-rc`'
    required: false
    default: false
  metadata:
    description:
      'Add custom build metadata, or derive a short SHA-1 hash. Example: `build123` or `fyf2c5fr` =>
      `v1.0.0-beta.1+fyf2c5fr`'
    required: false
  releasetype:
    description:
      'Release type version. `major`(X.y.z) or `minor`(x.Y.z) or `patch`(x.y.Z). If not specified, then no version will
      be incremented. All variants: `major`, `premajor`, `minor`, `preminor`, `patch`, `prepatch`, `prerelease`. More in
      semver doc: https://github.com/npm/node-semver/blob/main/README.md'
    required: false
  auto:
    description:
      'When true, releasetype is required. A specified releasetype increments once regardless of auto; auto does not add
      another increment.'
    required: false
    default: false
  dryrun:
    description: 'When true, calculate and output the tag without pushing it to GitHub.'
    required: false
    default: false

outputs:
  newtag:
    description: 'Output of the resulting tag. Example: `v1.0.0` | `v1.2.0-beta.5`'

runs:
  using: node24
  main: dist/index.js
