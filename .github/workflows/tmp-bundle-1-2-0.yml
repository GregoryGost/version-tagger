# Temporary one-branch action-bundle rebuild; removed before merging.
name: Regenerate 1.2.0 Action Bundle

on:
  push:
    branches:
      - fix/versioning-1.2.0-agent-template

permissions:
  contents: write

jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: ^10

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run bundle

      - name: Commit bundled JavaScript
        run: |
          git add -- dist/index.js
          if git diff --cached --quiet; then
            echo "Bundle is already up to date"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "build: regenerate bundled JavaScript for version 1.2.0"
          git push origin HEAD:refs/heads/fix/versioning-1.2.0-agent-template
