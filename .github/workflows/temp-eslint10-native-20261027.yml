# Temporary branch-only cross-libc verification; remove after lockfile refresh.
name: Refresh native resolver platforms

on:
  push:
    branches:
      - chore/eslint10-migration-20261026
    paths:
      - pnpm-workspace.yaml

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'GregoryGost/version-tagger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          cache: pnpm

      - name: Refresh lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify musl resolver binding
        run: |
          find node_modules/.pnpm -maxdepth 1 -type d -name '@unrs+resolver-binding-linux-x64-musl@*' -print |
            grep -q .

      - name: Verify peer dependencies
        run: pnpm peers check

      - name: Verify formatting and lint
        run: |
          pnpm run format:check
          pnpm run lint

      - name: Rebuild bundle
        run: pnpm run package

      - name: Commit generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pnpm-lock.yaml dist/index.js
          if git diff --cached --quiet; then
            echo 'Generated outputs unchanged'
            exit 0
          fi
          git commit -m 'build: lock cross-libc resolver binding for strict linter'
          git push origin HEAD:refs/heads/chore/eslint10-migration-20261026
