name: Main Self Versioning

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write

jobs:
  develop-version:
    if: github.event.pull_request.merged == true
    name: Main Self Versioning job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout step
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: New Version step
        id: new-version
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prefix: 'v'

      - name: Update v1 alias for stable releases
        env:
          RELEASE_TAG: ${{ steps.new-version.outputs.newtag }}
        run: bash script/sync-major-tag "$RELEASE_TAG"
