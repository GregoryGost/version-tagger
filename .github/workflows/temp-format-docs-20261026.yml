# Temporary branch-only formatter; remove after formatting the PR changes.
name: Format PR maintenance files

on:
  push:
    branches:
      - docs/align-action-metadata-20261026
    paths:
      - .github/workflows/temp-format-docs-20261026.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'GregoryGost/version-tagger' && github.ref == 'refs/heads/docs/align-action-metadata-20261026'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format README
        run: pnpm exec prettier --write README.md

      - name: Commit formatted files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md 
          if git diff --cached --quiet; then
            echo 'Already formatted'
            exit 0
          fi
          git commit -m 'docs: apply Prettier formatting to release documentation'
          git push origin HEAD:refs/heads/docs/align-action-metadata-20261026
