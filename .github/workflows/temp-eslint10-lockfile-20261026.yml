# Temporary PR-only helper; remove after locking and validating ESLint 10.
name: Refresh ESLint 10 lockfile

on:
  push:
    branches:
      - chore/eslint10-migration-20261026
    paths:
      - package.json

permissions:
  contents: write

jobs:
  update-lock:
    if: github.repository == 'GregoryGost/version-tagger' && github.ref == 'refs/heads/chore/eslint10-migration-20261026'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          cache: pnpm

      - name: Re-resolve dependencies
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Commit updated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Expected ESLint lockfile update missing' >&2
            exit 1
          fi
          git commit -m 'chore: refresh lockfile for ESLint 10'
          git push origin HEAD:refs/heads/chore/eslint10-migration-20261026

      - name: Validate ESLint 10
        run: pnpm run lint

      - name: Validate TypeScript types
        run: pnpm exec tsc --noEmit -p tsconfig.json
