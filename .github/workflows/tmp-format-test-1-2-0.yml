# Temporary branch-local validation and formatter; removed before merge.
name: Format and validate 1.2.0

on:
  push:
    branches:
      - fix/versioning-1.2.0-agent-template

permissions:
  contents: write

jobs:
  format-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: ^10
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Format and rebuild
        run: pnpm run bundle

      - name: Commit normalized sources and bundle
        run: |
          git add -- src/class/main.ts src/class/tag.ts src/class/github.ts
          git add -- __tests__/main.test.ts __tests__/tag.test.ts __tests__/github.test.ts
          git add -- dist/index.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "style: format versioning implementation and tests"
          git push origin HEAD:refs/heads/fix/versioning-1.2.0-agent-template

      - name: Run tests
        run: pnpm run ci-test

      - name: Run lint
        run: pnpm run lint
