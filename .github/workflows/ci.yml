name: Continuous Integration

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        id: setup-pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          cache: pnpm

      - name: Install Dependencies
        id: pnpm-install
        run: pnpm i --frozen-lockfile

      # A two-document lockfile can cause GitHub Dependency Graph to miss dependencies.
      - name: Check Dependency Graph Lockfile Compatibility
        run: |
          if grep -Eq '^---[[:space:]]*$' pnpm-lock.yaml; then
            echo 'Multi-document pnpm lockfiles are not yet supported by GitHub Dependency Graph' >&2
            exit 1
          fi

      - name: Check Format
        id: pnpm-format-check
        run: pnpm run format:check

      - name: Lint
        id: pnpm-lint
        run: pnpm run lint

      - name: TypeScript Typecheck
        run: |
          pnpm exec tsc --noEmit -p tsconfig.json
          pnpm exec tsc --noEmit -p tsconfig.jest.json

      - name: Tests
        id: pnpm-ci-test
        run: pnpm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Keep this dry run above released versions without changing package.json.
          version: '${{ github.run_number }}.0.0'
          prefix: 'v'
          postfix: 'testaction'
          postfixnoup: true
          dryrun: true

      - name: Print Output
        id: output
        run: echo "${{ steps.test-action.outputs.newtag }}"
