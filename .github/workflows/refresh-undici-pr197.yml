# Temporary maintenance workflow; remove it after generating the lockfile and bundle.
name: Refresh undici artifacts for PR 197

on:
  push:
    branches:
      - chore/strict-super-linter-20261026
    paths:
      - pnpm-workspace.yaml

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'GregoryGost/version-tagger' && github.ref == 'refs/heads/chore/strict-super-linter-20261026'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          cache: pnpm

      - name: Re-resolve patched dependency
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Regenerate checked-in Action bundle
        run: pnpm run package

      - name: Commit lockfile and bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pnpm-lock.yaml dist/index.js
          if git diff --cached --quiet; then
            echo 'Expected lockfile or bundled runtime change missing' >&2
            exit 1
          fi
          git diff --cached --stat
          git commit -m 'fix: update vulnerable undici and regenerate bundled Action'
          git push origin HEAD:refs/heads/chore/strict-super-linter-20261026
