version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: 'develop'
    schedule:
      interval: monthly
      time: '09:00'
      timezone: 'Europe/Moscow'
    labels:
      - actions
    reviewers:
      - GregoryGost
    groups:
      actions-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    target-branch: 'develop'
    schedule:
      interval: monthly
      time: '09:00'
      timezone: 'Europe/Moscow'
    labels:
      - pnpm
      - dependencies
    reviewers:
      - GregoryGost
    # The action targets Node 24, so do not adopt API types for newer Node releases.
    ignore:
      - dependency-name: '@types/node'
        versions: ['>=25.0.0']
    groups:
      development:
        dependency-type: development
        update-types:
          - minor
          - patch
      production:
        dependency-type: production
        update-types:
          - patch
